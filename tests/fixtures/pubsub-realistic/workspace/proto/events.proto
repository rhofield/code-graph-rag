syntax = "proto3";

package events.v1;

// Buf-style codegen layout: generated Go lands under gen/ — note the import
// path contains no "proto", "pb", or "grpc" token.
option go_package = "example.com/backend/gen/events/v1;eventsv1";

// Published to the Pub/Sub topic "user-created" whenever a user signs up.
message UserCreated {
  string id = 1;
  string name = 2;
  string email = 3;
}

// Published to the Pub/Sub topic "order-shipped".
message OrderShipped {
  string order_id = 1;
  string user_id = 2;
}
