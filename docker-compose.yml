services:
  neo4j:
    image: neo4j:5-community
    container_name: rho-graph-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/rho-graph
      NEO4J_PLUGINS: '[]'
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_dbms_memory_transaction_total_max: '0'
    volumes:
      - rho-graph-data:/data
    restart: unless-stopped

  # Dedicated ephemeral instance for integration tests, so test fixtures never
  # pollute (or collide with) the live dev graph. Data lives in tmpfs — wiped
  # on container restart. Start with: docker compose --profile test up -d
  neo4j-test:
    image: neo4j:5-community
    container_name: rho-graph-neo4j-test
    profiles: ["test"]
    ports:
      - "7475:7474"
      - "7688:7687"
    environment:
      NEO4J_AUTH: neo4j/code-graph-rag
      NEO4J_PLUGINS: '[]'
    tmpfs:
      - /data

volumes:
  rho-graph-data:
    name: rho-graph-data
